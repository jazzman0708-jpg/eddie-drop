<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob: file: https: http://localhost:*; img-src 'self' data: blob: https: file:; media-src 'self' data: blob: https: file:;">
<title>Eddie Drop</title>
<link rel="stylesheet" href="shell/loader.css">
</head>
<!--
  이 파일은 껍데기다. 실제 기능은 사용자 폴더에서 불러온다.
      맥   ~/Library/Application Support/Eddie/plugins/eddie-drop/
      윈도 %APPDATA%\Eddie\plugins\eddie-drop\
  그래서 기능을 고칠 때 설치 파일을 다시 깔 필요가 없다.
-->
<body>
<div id="app">
  <nav id="tabbar"></nav>
  <main id="views"></main>
  <footer id="statusbar">
    <span class="dot" id="status-dot"></span>
    <span class="msg" id="status-msg">시작하는 중…</span>
    <span id="status-ver"></span>
  </footer>
</div>

<div id="toast"></div>

<div id="boot">
  <div class="mark">Eddie Drop</div>
  <div class="bar"></div>
  <div id="boot-status">준비하는 중…</div>
  <div id="boot-detail"></div>
</div>

<script src="js/CSInterface.js"></script>
<script src="shell/loader.js"></script>
</body>
</html>
