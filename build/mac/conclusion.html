<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
 body{font:13px -apple-system,"Apple SD Gothic Neo",sans-serif;color:#222;margin:0;line-height:1.8}
 h2{font-size:15px;margin:0 0 12px}
 .step{margin:10px 0;padding:12px 14px;background:#f2f4f8;border-radius:6px}
 .big{font-size:14px;font-weight:600}
 .dim{color:#666;font-size:12px;margin-top:12px}
</style></head>
<body>
<h2>설치가 끝났습니다 🎉</h2>

<div class="step">
  <div class="big">프리미어를 재시작한 뒤<br>Window → Extensions 에서 열어주세요</div>
</div>

<p class="dim">
  처음 열면 <b>설정 탭</b>에서 API 키를 넣어야 검색이 됩니다.<br>
  각 칸의 “키 발급받기 ↗” 를 누르면 발급 페이지가 열립니다.<br><br>
  내 컴퓨터에 있는 파일은 키 없이 <b>내 파일</b> 탭에서 바로 쓸 수 있습니다.
</p>
</body></html>
