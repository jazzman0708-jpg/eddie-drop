name: 설치 파일 만들기

on:
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    tags: ['v*']              # v0.4.0 처럼 태그를 붙이면 자동 실행

jobs:
  # ------------------------------------------------------------------
  # 1) 맥에서 확장을 CEP 서명하고 .pkg 를 만든다
  # ------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 읽기
        id: ver
        run: |
          V=$(python3 -c "import xml.etree.ElementTree as ET;print(ET.parse('CSXS/manifest.xml').getroot().attrib['ExtensionBundleVersion'])")
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: ZXPSignCmd 받기
        run: |
          mkdir -p build/tools
          curl -sSL -o build/tools/ZXPSignCmd \
            https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd
          chmod +x build/tools/ZXPSignCmd
          xattr -d com.apple.quarantine build/tools/ZXPSignCmd || true

      - name: 서명 인증서 준비
        env:
          CERT_BASE64: ${{ secrets.CEP_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CEP_CERT_PASSWORD }}
        run: |
          mkdir -p build/certs
          if [ -n "$CERT_BASE64" ]; then
            echo "$CERT_BASE64" | base64 --decode > build/certs/selfsigned.p12
            printf '%s' "$CERT_PASSWORD" > build/certs/password.txt
          fi
          # 없으면 build.sh 가 새로 만든다 (단, 매번 달라지므로 Secrets 등록을 권장)

      - name: 맥 설치 파일 만들기
        run: ./build/build.sh mac

      # 인증서가 있으면 서명·공증까지 (없으면 건너뜀)
      # - name: Developer ID 서명·공증
      #   env:
      #     DEVELOPER_ID: ${{ secrets.MAC_DEVELOPER_ID }}
      #     NOTARY_PROFILE: eddie-notary
      #   run: ./build/sign/mac-notarize.sh dist/*.pkg

      - name: 서명된 확장 폴더 넘기기   # 윈도우 빌드가 그대로 쓴다
        uses: actions/upload-artifact@v4
        with:
          name: signed-extension
          path: build/.work/payload/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: EddieDrop-mac
          path: dist/*.pkg

  # ------------------------------------------------------------------
  # 2) 윈도우에서 .exe 를 만든다 (NSIS 가 기본 설치돼 있다)
  # ------------------------------------------------------------------
  win:
    runs-on: windows-latest
    needs: mac
    steps:
      - uses: actions/checkout@v4

      - name: 버전 읽기
        id: ver
        shell: bash
        run: |
          V=$(python -c "import xml.etree.ElementTree as ET;print(ET.parse('CSXS/manifest.xml').getroot().attrib['ExtensionBundleVersion'])")
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: 서명된 확장 폴더 받기
        uses: actions/download-artifact@v4
        with:
          name: signed-extension
          path: payload

      - name: NSIS 설치
        run: choco install nsis -y --no-progress

      - name: 윈도우 설치 파일 만들기
        shell: cmd
        run: |
          mkdir dist
          "C:\Program Files (x86)\NSIS\makensis.exe" ^
            /DVERSION=${{ steps.ver.outputs.version }} ^
            /DPAYLOAD=%CD%\payload\com.eddie.drop ^
            /DOUTFILE=%CD%\dist\EddieDrop-${{ steps.ver.outputs.version }}-win.exe ^
            build\win\installer.nsi

      # 코드 서명 인증서가 있으면 주석을 푸세요 (build/sign/win-signtool.md 참고)
      # - name: 코드 서명
      #   shell: pwsh
      #   env:
      #     WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
      #     WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_BASE64))
      #     & signtool sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 `
      #         /tr http://timestamp.digicert.com /td SHA256 dist\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EddieDrop-win
          path: dist/*.exe
